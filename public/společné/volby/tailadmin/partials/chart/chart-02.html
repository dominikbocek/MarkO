<div
  class="rounded-2xl border border-gray-200 bg-gray-100 dark:border-gray-800 dark:bg-white/[0.03]"
>
  <div
    class="shadow-default rounded-2xl bg-white px-5 pb-11 pt-5 dark:bg-gray-900 sm:px-6 sm:pt-6"
  >
    <div class="flex justify-between">
      <div>
        <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
          Volební účast
        </h3>
      </div>
    </div>
    <div class="relative max-h-[195px]">
      <div id="chartTwo" class="h-full"></div>
    </div>
  </div>
</div>
<script type="module">

  <% if(info.lokalita.druh !== "stát") {
    %>const id_obce = <%= info['lokalita']['KODZASTUP'] %>
  <% } %>

  <%
  if(info["druh"] !== "komunální") {
    if(info.lokalita.druh == "obec" || info.lokalita.druh == "stát") {
    %>let zdroj = '/volby/<%= info["název"] %>/<% if(info.kolo !== undefined) {%><%= info.kolo%>/<%}  %>statistics-obce.csv'<%
    } else if(info.lokalita.druh == "obvod") {
    %>let zdroj = '/volby/<%= info["název"] %>/<% if(info.kolo !== undefined) {%><%= info.kolo%>/<%}  %>statistics.csv'<%
    }
  } else {%>let zdroj = `./${id_obce}.csv`<%}
  %>

  let vysledky = await d3.csv(zdroj)
  <% if(info.lokalita.druh !== "stát" && info.druh !== "komunální") {// pro zpracování obcí ve volbách mimo komunální
    %><% if(info.lokalita.druh == "obec") {%>
    vysledky = vysledky.filter(function(element) {return element["id"] == id_obce})[0]
    let odevz_obalky = vysledky.ODEVZ_OBAL
    let vol_seznam = vysledky.VOL_SEZNAM
    <%} else {%>
      vysledky = vysledky.filter(function(element) {return element["id"].startsWith(id_obce)})
      let odevz_obalky = d3.sum(vysledky, d => d.ODEVZ_OBAL)
      let vol_seznam = d3.sum(vysledky, d => d.VOL_SEZNAM)
    <%}
  } else if(info.druh == "komunální") {%>// pro zpracování obcí pro komunální volby, pro přehled pro celostát u komunálních voleb se zatím nepočítá
    let odevz_obalky = d3.sum(vysledky, d => d.ODEVZ_OBAL)
    let vol_seznam = d3.sum(vysledky, d => d.VOL_SEZNAM)
  <%} else {%>
    let odevz_obalky = d3.sum(vysledky, d => d.ODEVZ_OBAL)
    let vol_seznam = d3.sum(vysledky, d => d.VOL_SEZNAM)
  <%} %>

let ucast = Math.round((odevz_obalky / vol_seznam)*10000)/100

function chart02(selector, value, options = {}) {

    const {
        width = 330,
        height = 190,
        color = "#465FFF",
        background = "#E4E7EC",
        thickness = 20
    } = options;

    const outerRadius = width * 0.42;
    const innerRadius = outerRadius - thickness;

    const svg = d3.select(selector)
        .append("svg")
        .attr("viewBox", `0 0 ${width} ${height}`)
        .style("width", "60%")
        .style("height", "auto")
        .style("margin", "auto")
        .attr("class", "max-h-[195px]");

    const g = svg.append("g")
        .attr(
            "transform",
            `translate(${width / 2}, ${height - 20})`
        );

    const arc = d3.arc()
        .innerRadius(innerRadius)
        .outerRadius(outerRadius)
        .cornerRadius(thickness / 2);

    // pozadí
    g.append("path")
        .attr("d", arc({
            startAngle: -Math.PI / 2,
            endAngle: Math.PI / 2
        }))
        .attr("fill", background);

    // hodnota
    g.append("path")
        .attr("d", arc({
            startAngle: -Math.PI / 2,
            endAngle:
                -Math.PI / 2 +
                Math.PI * value / 100
        }))
        .attr("fill", color);

    // číslo
    g.append("text")
        .attr("text-anchor", "middle")
        .attr("y", -25)
        .attr("font-family", "Outfit, sans-serif")
        .attr("font-size", 36)
        .attr("font-weight", 600)
        .attr("fill", "#1D2939")
        .text(`${value.toString().replace(".", ",")}%`);
}

chart02("#chartTwo", ucast)
</script>
