<div
  class="overflow-hidden rounded-2xl border border-gray-200 bg-white px-5 pt-5 dark:border-gray-800 dark:bg-white/[0.03] sm:px-6 sm:pt-6"
>
  <div class="flex items-center justify-between">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Graf volebních výsledků (zobrazeny strany s více než 1 % hlasů)
    </h3>
  </div>

  <div class="max-w-full overflow-x-auto custom-scrollbar">
    <div class="min-w-[650px] pl-2 xl:min-w-full">
      <div
        id="chartOne"
        class="h-full min-w-[650px] pl-2 xl:min-w-full"
      ></div>
    </div>
  </div>
</div>
<script type="module">
async function nactenivysledku(url) {
  try {
    return await d3.json(url)
  } catch(err) {
    console.error("Chyba při načítání dat:", err)
    document.getElementById("chartOne").innerHTML = "<p>Chyba při načítání dat. Soubor pravděpodobně neexistuje.</p>";
  }
}

  <% if(info.lokalita.druh !== "stát") {
    %>const id_obce = <%= info['lokalita']['KODZASTUP'] %>
  <% } %>

  const vysledky = `<% if(info['druh'] == 'komunální') {%>vysledky_cr_${id_obce}.json<%} else {%>vysledky_cr.json<%}%>`

  const data = await nactenivysledku(vysledky)
  window.filtrovanadata = data.filter(function(el) {if(el["proc_hlasu"] > 1) {return el}})
  filtrovanadata = filtrovanadata.slice(0,10) // prvních deset položek má přiřazené barvy

  window.strop = d3.max(data, (d) => {return d.proc_hlasu})

  if((strop % 10) < 5) {strop = ((Math.round(strop / 10))*10 + 5)}
  else if((strop % 10) > 5) {strop = (Math.round(strop / 10))*10}

  var graf = Plot.plot({// pokud má více koalic stejnou zkratku, sloupečky se zobrazí nad sebou
  x: {label: "volební subjekty"},
  y: {percent: false, label: "procenta", grid: true},
  marks: [
    Plot.barY(
      filtrovanadata, {
        x: "<% if(info['druh'] == 'prezidentské') {%>kandidat<%} else if(info['druh'] == 'komunální') {%>strana<%} else {%>zkratka<%} %>", //u prezidentských voleb kandidat
        y: "proc_hlasu",
        fill: "color",
        text: "test",
        sort: {x: "-y"},
        title: function (d) {var cislo = `${Math.round(d.proc_hlasu*100)/100} %`; return cislo.replace(".", ",")},
        tip: true
      }
    ),
    Plot.ruleY([0], {stroke: "black"}),
    Plot.ruleY([strop], {stroke: ""})
  ]
})

document.getElementById("chartOne").append(graf)
</script>
