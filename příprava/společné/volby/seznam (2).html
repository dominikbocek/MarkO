<!DOCTYPE html>
<html lang="cs">
    <head>
        <title>Seznam zpracovaných voleb</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <!-- ikony -->
        <%- include('společné/icons.ejs'); %>
        <meta name="color-scheme" content="light dark">
        <style>
            * {
                color: light-dark(#212529, white) !important;
                background: light-dark(white, #212529) !important
            }

            html {
                height: 100%;
            }

            body {
                height: inherit;
                position: absolute;
                width: 100%;
            }

            main {
                top: 50px;
                position: relative;
                padding: 2px 10vw;
            }

            h1 {
                margin: 15px 0;
            }

            main a {
                text-decoration: underline;
                color: #41caff !important;
                font-weight: bold;
            }

            h1 {
                font-weight: bold;
            }
            li > div {
                display: inline;
                margin-left: 10px;
            }
            li > div div {
                display: inline-flex;
                margin-left: 6px;
                align-items: baseline;
                gap: 10px;

            }
        </style>
    </head>
    <body>
        <%- include('společné/menu.ejs') %>
        <main>
            <h1>Přehled zpracovaných voleb</h1>
            <ul>
            <%
                for (var i = 0; i < seznam.length ; i++) {%>
                    <li><a href="/volby/<%= cesty[i] %>" target="_blank"><%= seznam[i] %></a>
                <% } %>
            </ul>
        </main>
    </body>
</html>
